<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LORDIFY</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#09090c;
      color:#fff;
      min-height:100vh;
    }
    .top{
      padding:34px 18px 28px;
      border-bottom:1px solid #202032;
      text-align:center;
      background:radial-gradient(circle at 50% 30%,#18220b 0,#09090c 55%);
    }
    .brand{
      font-size:clamp(38px,9vw,72px);
      font-weight:900;
      letter-spacing:2px;
      font-style:italic;
      color:#ff3030;
      text-shadow:0 0 22px rgba(140,255,0,.45);
    }
    .live{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-left:12px;
      padding:10px 18px;
      border-radius:28px;
      background:#ff3030;
      color:#ffffff;
      font-weight:900;
      vertical-align:middle;
      font-size:14px;
    }
    .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#ffffff}

    .wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}
    .channels{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      padding:28px;
      border:1px solid #26263b;
      border-radius:34px;
      background:#151519;
      box-shadow:0 10px 35px rgba(0,0,0,.25);
    }
    .channel{
      border:2px solid;
      border-radius:28px;
      padding:24px 14px;
      font-size:20px;
      font-weight:800;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }
    .channel:hover{transform:translateY(-2px)}
    .wa{background:#24242b;border-color:#55555f}
    .tg{background:#292930;border-color:#66666f}

    .hero{padding:65px 0 45px}
    .hero h1{font-size:clamp(54px,12vw,104px);line-height:.86;font-weight:950}
    .hero h1 span{color:#ff3030}
    .affordable-prices{
      margin-top:14px;
      color:#ff3030;
      font-size:clamp(22px,5vw,38px);
      font-weight:950;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .hero p{
      margin-top:12px;
      font-size:clamp(19px,4vw,31px);
      font-weight:800;
      line-height:1.25;
      max-width:850px;
    }

    .tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-bottom:28px;
    }
    .tab{
      padding:23px;
      border-radius:25px;
      background:#202025;
      border:2px solid #38383f;
      color:#fff;
      font-size:21px;
      font-weight:900;
      cursor:pointer;
    }
    .tab.active{
      background:#24242b;
      border-color:#ff3030;
      color:#ff3030;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:22px;
    }
    .card{
      overflow:hidden;
      border-radius:28px;
      background:#1c1c21;
      border:1px solid #44444c;
      box-shadow:0 12px 35px rgba(0,0,0,.28);
    }
    .visual{
      min-height:230px;
      padding:22px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,110,0,.35),transparent 30%),
        linear-gradient(135deg,#1a1718,#08090d);
    }
    .visual.blue{
      background:
        radial-gradient(circle at 70% 20%,rgba(40,90,255,.5),transparent 35%),
        linear-gradient(135deg,#101536,#08090d);
    }
    .badge{
      align-self:flex-end;
      background:#ff3030;
      color:#ffffff;
      padding:9px 14px;
      border-radius:18px;
      font-weight:900;
    }
    .stats{
      padding:14px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      background:rgba(0,0,0,.35);
      font-weight:800;
      line-height:1.5;
    }
    .body{padding:22px}
    .body h2{font-size:22px;margin-bottom:13px}
    .price{
      color:#ff3030;
      font-size:25px;
      font-weight:950;
      margin:4px 0 7px;
    }
    .muted{color:#858596;font-weight:700;margin-bottom:20px}
    .buy{
      width:100%;
      border:0;
      border-radius:16px;
      padding:16px;
      background:#ff3030;
      color:#ffffff;
      font-size:17px;
      font-weight:950;
      cursor:pointer;
    }
    .empty{display:none;text-align:center;padding:50px;color:#aaa}

    .order-box{
      width:min(520px,94vw);
      background:#202025;
      border:1px solid #4a4a52;
      border-radius:32px;
      padding:38px 34px 30px;
      position:relative;
      text-align:center;
      box-shadow:0 25px 80px rgba(0,0,0,.7);
    }
    .order-box h2{
      font-size:clamp(25px,6vw,40px);
      margin:5px 35px 16px;
      color:#fff;
    }
    .order-price{
      color:#ff3030;
      font-size:clamp(38px,9vw,62px);
      font-weight:950;
      letter-spacing:1px;
      margin-bottom:10px;
    }
    .order-info{
      color:#9999a4;
      font-size:16px;
      font-weight:700;
      margin-bottom:28px;
    }
    .order-actions{display:grid;gap:14px}
    .order-btn{
      width:100%;
      min-height:68px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      border:0;
      font:900 18px Arial,sans-serif;
      cursor:pointer;
      transition:.18s;
    }
    .order-btn:hover{transform:translateY(-2px)}
    .whatsapp-btn{background:#25d366;color:#fff}
    .telegram-btn{background:#249bd1;color:#fff}
    .email-btn{background:#ff3030;color:#fff}
    .cancel-btn{
      background:transparent;
      color:#fff;
      border:2px solid #4a4a52;
    }

    .modal{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      padding:20px;background:rgba(0,0,0,.78);z-index:50;
    }
    .modal.show{display:flex}
    .modal-box{
      width:min(440px,100%);background:#17171c;border:1px solid #4a4a52;
      border-radius:28px;padding:28px;position:relative;text-align:center;
      box-shadow:0 20px 70px rgba(0,0,0,.6);
    }
    .close{
      position:absolute;right:15px;top:10px;border:0;background:transparent;
      color:#fff;font-size:32px;cursor:pointer;
    }
    .modal-title{font-size:30px;font-weight:950;color:#ff3030;margin-bottom:10px}
    .modal-box p{color:#aaa;margin-bottom:6px}
    .modal-box strong{display:block;font-size:20px;margin-bottom:22px}
    .contact-circles{
      display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:22px 0;
    }
    .circle-contact{
      width:92px;height:92px;border-radius:50%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:5px;text-decoration:none;
      color:#fff;border:2px solid #55555f;transition:.2s;
      box-shadow:0 8px 22px rgba(0,0,0,.35);
    }
    .circle-contact:hover{transform:scale(1.07)}
    .circle-contact span{font-size:27px;font-weight:900}
    .circle-contact b{font-size:12px}
    .circle-contact.email{background:#3a3a42}
    .circle-contact.whatsapp{background:#222226;border-color:#ff3030}
    .circle-contact.telegram{background:#4a4a52}
    .modal-box small{display:block;color:#777;margin-top:18px;line-height:1.4}
    .visual:before{
      content:'LORDIFY';font-size:28px;font-weight:950;letter-spacing:1px;
      color:#ff3030;text-shadow:0 0 16px rgba(140,255,0,.35);
    }
    footer{text-align:center;color:#777;padding:25px;font-size:14px}

    @media(max-width:650px){
      .channels,.products{grid-template-columns:1fr}
      .tabs{grid-template-columns:1fr 1fr}
      .brand{font-size:42px}
      .hero{padding-top:45px}
      .hero h1{font-size:62px}
      .channel{padding:21px 10px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">♛ LORDIFY <span class="live">LIVE</span></div>
  </header>

  <main class="wrap">
    <section class="channels">
      <button class="channel wa" onclick="openLink('https://whatsapp.com/channel/0029Vb92qWY3bbUvzepOFW3J')">WhatsApp Channel</button>
      <button class="channel tg" onclick="openLink('https://t.me/')">Telegram Channel</button>
    </section>

    <section class="hero">
      <h1>♛ LORDIFY</h1>
      <div class="affordable-prices">AFFORDABLE PRICES</div>
      <p>FREE FIRE • CPM • FACEBOOK • TIKTOK</p>
    </section>

    <section class="tabs">
      <button class="tab active" data-category="freefire">FREE FIRE 🔥</button>
      <button class="tab" data-category="cpm">CPM 🚗</button>
      <button class="tab" data-category="facebook">FACEBOOK 📘</button>
      <button class="tab" data-category="tiktok">TIKTOK 🎵</button>
      <button class="tab" data-category="numbers">FOREIGN NUMBER 🌍</button>
    </section>

    <section id="products" class="products"></section>
    <div id="empty" class="empty">No products in this category yet.</div>
  </main>

  <div id="contactModal" class="modal">
    <div class="order-box">
      <button class="close" onclick="closeModal()">×</button>
      <h2 id="selectedProduct">Selected Item</h2>
      <div class="order-price">CONTACT</div>
      <p class="order-info">Choose how you want to contact LORDIFY</p>

      <div class="order-actions">
        <a class="order-btn whatsapp-btn"
           href="https://wa.me/message/DYA3EPLZJMJBE1"
           target="_blank">Buy via WhatsApp</a>

        <a class="order-btn telegram-btn"
           href="https://t.me/Gendove1"
           target="_blank">Buy via Telegram</a>

        <a class="order-btn email-btn"
           href="mailto:Ifechukwudavid606@gmail.com">Buy via Email</a>

        <button class="order-btn cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <footer>© 2026 LORDIFY • All rights reserved</footer>

<script>
const products = [
  {
    category:'freefire',
    title:'Prime One Account',
    price:'Affordable',
    level:'FREE FIRE',
    badge:'AVAILABLE',
    stats:['🔥 Prime One account','🎯 Gaming account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'freefire',
    title:'Prime Two Account',
    price:'Affordable',
    level:'FREE FIRE',
    badge:'AVAILABLE',
    blue:true,
    stats:['🔥 Prime Two account','🎯 Gaming account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'freefire',
    title:'Prime Three Account',
    price:'Affordable',
    level:'FREE FIRE',
    badge:'AVAILABLE',
    stats:['🔥 Prime Three account','🎯 Gaming account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'freefire',
    title:'Prime Four to Eight Account',
    price:'Affordable',
    level:'FREE FIRE',
    badge:'AVAILABLE',
    blue:true,
    stats:['🔥 Prime Four to Eight','🎯 Gaming account','⚡ Fast response','📲 Contact to order']
  },

  {
    category:'cpm',
    title:'All Cars Unlocked Account',
    price:'₦2,000',
    level:'CPM',
    badge:'AVAILABLE',
    stats:['🚗 All cars unlocked','🏆 CPM account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'cpm',
    title:'50M + 500 Coin Account',
    price:'₦2,000',
    level:'CPM',
    badge:'AVAILABLE',
    blue:true,
    stats:['💰 50M money','🪙 500 coins','🚗 CPM account','📲 Contact to order']
  },
  {
    category:'cpm',
    title:'Everything Unlocked Account',
    price:'₦2,000',
    level:'CPM',
    badge:'AVAILABLE',
    stats:['🔓 Everything unlocked','🚗 CPM account','🏆 Premium progress','📲 Contact to order']
  },

  {
    category:'facebook',
    title:'US Facebook',
    price:'Affordable',
    level:'FACEBOOK',
    badge:'AVAILABLE',
    stats:['🇺🇸 US Facebook','📘 Facebook account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'facebook',
    title:'UK Facebook',
    price:'Affordable',
    level:'FACEBOOK',
    badge:'AVAILABLE',
    blue:true,
    stats:['🇬🇧 UK Facebook','📘 Facebook account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'facebook',
    title:'MEXICO Facebook',
    price:'Affordable',
    level:'FACEBOOK',
    badge:'AVAILABLE',
    stats:['🇲🇽 Mexico Facebook','📘 Facebook account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'facebook',
    title:'NETHERLAND Facebook',
    price:'Affordable',
    level:'FACEBOOK',
    badge:'AVAILABLE',
    blue:true,
    stats:['🇳🇱 Netherland Facebook','📘 Facebook account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'facebook',
    title:'CANADA Facebook',
    price:'Affordable',
    level:'FACEBOOK',
    badge:'AVAILABLE',
    stats:['🇨🇦 Canada Facebook','📘 Facebook account','⚡ Fast response','📲 Contact to order']
  },

  {
    category:'tiktok',
    title:'LOCAL TikTok',
    price:'Affordable',
    level:'TIKTOK',
    badge:'AVAILABLE',
    stats:['🎵 Local TikTok','📱 TikTok account','⚡ Fast response','📲 Contact to order']
  },
  {
    category:'tiktok',
    title:'FOREIGN TikTok',
    price:'Affordable',
    level:'TIKTOK',
    badge:'AVAILABLE',
    blue:true,
    stats:['🌍 Foreign TikTok','📱 TikTok account','⚡ Fast response','📲 Contact to order']
  }
,
  {
    category:'numbers',
    title:'FOREIGN NUMBER — ALL COUNTRIES',
    level:'International numbers',
    price:'₦7,000',
    badge:'₦7K',
    stats:['🌍 All countries available','📱 Foreign number','⚡ Fast response','📲 Contact to order']
  }
];

const productsEl = document.getElementById('products');
const emptyEl = document.getElementById('empty');

function render(category){
  const list = products.filter(p => p.category === category);
  productsEl.innerHTML = list.map(p => `
    <article class="card">
      <div class="visual ${p.blue ? 'blue' : ''}">
        <div class="badge">📦 ${p.badge}</div>
        <div class="stats">${p.stats.map(s=>`<div>${s}</div>`).join('')}</div>
      </div>
      <div class="body">
        <h2>${p.title}</h2>
        <div class="price">${p.price || "Affordable"}</div>
        <div class="muted">${p.level}</div>
        <button class="buy" onclick="buy('${p.title}')">BUY NOW</button>
      </div>
    </article>
  `).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function buy(name){
  document.getElementById('selectedProduct').textContent = name;
  document.getElementById('contactModal').classList.add('show');
}

function closeModal(){ document.getElementById('contactModal').classList.remove('show'); }
function openLink(url){ window.open(url,'_blank'); }

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.category);
  });
});

render('freefire');
</script>
</body>
</html>
